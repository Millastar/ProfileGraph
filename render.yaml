services:
  - type: web
    name: project-2-qwen-rag
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python webUI.py
    healthCheckPath: /
    envVars:
      - key: APP_ACCESS_CODE
        sync: false
      - key: QWEN_BASE_URL
        sync: false
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
